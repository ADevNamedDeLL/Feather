name: Build Linux releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: feather-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  linux-x86_64:
    name: Linux x86_64 release
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Validate release version
        shell: bash
        run: |
          VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          if [[ -z "$VERSION" ]]; then
            echo "Could not read package version from Cargo.toml." >&2
            exit 1
          fi
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
            echo "Release tag $GITHUB_REF_NAME does not match Cargo.toml version $VERSION." >&2
            exit 1
          fi
          echo "Building Feather $VERSION"

      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl unzip zip file patchelf \
            libgtk-4-dev libgtksourceview-5-dev libfuse2 desktop-file-utils

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --locked

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Install linuxdeploy and GTK plugin
        run: |
          sudo curl -fL --retry 3 --retry-delay 2 https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -o /usr/local/bin/linuxdeploy
          sudo chmod +x /usr/local/bin/linuxdeploy
          sudo curl -fL --retry 3 --retry-delay 2 https://raw.githubusercontent.com/linuxdeploy/linuxdeploy-plugin-gtk/master/linuxdeploy-plugin-gtk.sh -o /usr/local/bin/linuxdeploy-plugin-gtk
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-gtk
          echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"
          echo "/usr/local/bin" >> "$GITHUB_PATH"

      - name: Build release packages
        run: bash ./scripts/package-release.sh

      - name: Verify release packages
        shell: bash
        run: |
          VERSION="$(awk -F'"' '/^version = "/ { print $2; exit }' Cargo.toml)"
          test -s "dist/Feather-$VERSION-linux-x86_64.zip"
          test -s "dist/Feather-$VERSION-source.zip"
          test -s "dist/Feather-$VERSION-x86_64.AppImage"
          unzip -t "dist/Feather-$VERSION-linux-x86_64.zip"
          unzip -t "dist/Feather-$VERSION-source.zip"
          file "dist/Feather-$VERSION-x86_64.AppImage"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feather-linux-x86_64
          path: |
            dist/Feather-*-linux-x86_64.zip
            dist/Feather-*-source.zip
            dist/Feather-*-x86_64.AppImage
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: Feather ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Feather-*-linux-x86_64.zip
            dist/Feather-*-source.zip
            dist/Feather-*-x86_64.AppImage
