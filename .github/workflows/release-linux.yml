name: Build Linux releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install native build and packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential pkg-config curl unzip zip \
            libgtk-4-dev libgtksourceview-5-dev \
            libfuse2 file patchelf

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --locked

      - name: Build optimized binary
        run: cargo build --release --locked

      - name: Install linuxdeploy and GTK plugin
        run: |
          sudo curl -fsSL \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            -o /usr/local/bin/linuxdeploy
          sudo chmod +x /usr/local/bin/linuxdeploy
          sudo curl -fsSL \
            https://github.com/linuxdeploy/linuxdeploy-plugin-gtk/releases/download/continuous/linuxdeploy-plugin-gtk.sh \
            -o /usr/local/bin/linuxdeploy-plugin-gtk.sh
          sudo chmod +x /usr/local/bin/linuxdeploy-plugin-gtk.sh
          sudo curl -fsSL \
            https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage \
            -o /usr/local/bin/appimagetool
          sudo chmod +x /usr/local/bin/appimagetool
          echo "APPIMAGETOOL=/usr/local/bin/appimagetool" >> "$GITHUB_ENV"

      - name: Package ZIP installer and AppImage
        run: ./scripts/package-release.sh

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Feather-linux-x86_64
          path: |
            dist/*.zip
            dist/*.AppImage
          if-no-files-found: error

      - name: Attach release files to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.AppImage
